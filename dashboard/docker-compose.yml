services:
  db:
    image: postgres:17
    container_name: plantpulse-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - plantpulse_db_data:/var/lib/postgresql/data
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plantpulse -d plantpulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  plantpulse_db_data:
