
name: PlantPulse CI

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  
  # -------------------------------
  # BACKEND - Python + PostgreSQL
  # -------------------------------
  backend-check:
    name: Backend checks
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: plantpulse_test
      POSTGRES_USER: plantpulse
      POSTGRES_PASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: plantpulse_test
          POSTGRES_USER: plantpulse
          POSTGRES_PASSWORD: ci-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U plantpulse -d plantpulse_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: dashboard/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/backend/requirements-dev.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q dashboard/backend/app

      - name: Run backend tests
        working-directory: dashboard/backend
        run: python -m pytest -v

  # -------------------------------
  # FRONTEND - React
  # -------------------------------
  frontend-check:
    name: Frontend checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/frontend/package-lock.json

      - name: Install dependencies
        working-directory: dashboard/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: dashboard/frontend
        run: npm run lint

      - name: Build frontend
        working-directory: dashboard/frontend
        run: npm run build


  # -------------------------------
  # HARDWARE - C++
  # -------------------------------
  hardware-check:
    name: Hardware compilation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libcurl4-openssl-dev \
            nlohmann-json3-dev

      - name: Compile hardware simulator
        run: |
          g++ -std=c++17 -Wall -Wextra -pedantic \
            hardware/main.cpp \
            -o /tmp/plantpulse \
            $(pkg-config --cflags --libs libcurl)


  # -------------------------------
  # DOCKER - Configuration
  # -------------------------------
  docker-check:
    name: Docker configuration
    runs-on: ubuntu-latest

    env:
      POSTGRES_DB: plantpulse
      POSTGRES_USER: plantpulse
      POSTGRES_PASSWORD: ci-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: 5432

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Docker Compose
        run: |
          docker compose -f dashboard/docker-compose.yml config --quiet


  # -------------------------------
  # CD - Docker image publishing
  # -------------------------------
  docker-publish:
    name: Build and publish Docker images
    runs-on: ubuntu-latest

    needs:
      - backend-check
      - frontend-check
      - hardware-check
      - docker-check

    # Pubblica solo da main, tramite push o avvio manuale.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # BACKEND
      - name: Generate backend image metadata
        id: backend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/giovannigrigoli/plantpulse-backend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish backend
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard/backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # FRONTEND
      - name: Generate frontend image metadata
        id: frontend-meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/giovannigrigoli/plantpulse-frontend
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and publish frontend
        uses: docker/build-push-action@v7
        with:
          context: ./dashboard/frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
